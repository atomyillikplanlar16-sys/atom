<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFF4EA;font-family:"Nunito Sans",system-ui,sans-serif;color:#2A2620;padding:24px}
.card{width:100%;max-width:420px;background:#fff;border-radius:22px;padding:36px 32px;box-shadow:0 18px 40px -22px rgba(42,38,32,.45);text-align:center}
h1{font-family:"Poppins",system-ui,sans-serif;font-size:1.5rem;margin:12px 0 6px;color:#2A2620}
p{margin:0 0 22px;color:#6A6256;font-size:1rem;line-height:1.5}
label{display:block;text-align:left;font-weight:700;font-size:.95rem;margin-bottom:6px}
input{width:100%;min-height:48px;font:inherit;font-size:1.05rem;padding:0 14px;border:2px solid #F2E2D2;border-radius:12px;background:#fff;color:#2A2620}
input:focus{outline:3px solid #C24A0B;outline-offset:1px;border-color:#C24A0B}
button{margin-top:16px;width:100%;min-height:48px;font-family:"Poppins",system-ui,sans-serif;font-weight:600;font-size:1.02rem;color:#fff;background:#C24A0B;border:0;border-radius:999px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:1.4em;margin-top:12px;color:#B3261E;font-weight:700;font-size:.95rem}
.back{display:inline-block;margin-top:18px;color:#6A6256;font-size:.9rem}
</style>

function open(pass){
 var b=b64(P),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28),enc=new TextEncoder();
